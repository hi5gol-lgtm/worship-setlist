<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예배 Set List 빌더 | R45 Worship</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f7f5;--surface:#fff;--border:#e5e5e0;--border2:#d0d0c8;
  --text:#1a1a18;--text2:#6b6b65;--text3:#9a9a92;
  --accent:#2563eb;--accent-bg:#eff6ff;
  --green:#16a34a;--green-bg:#f0fdf4;
  --red:#dc2626;--red-bg:#fef2f2;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --orange:#ea580c;--orange-bg:#fff7ed;
  --pink:#db2777;--pink-bg:#fdf2f8;
  --radius:10px;--radius-sm:6px
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* 로그인 */
#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000}
#appScreen{display:none}
.login-box{text-align:center;padding:40px 32px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);max-width:320px;width:90%}
.login-logo{font-size:36px;margin-bottom:12px}
.login-title{font-size:18px;font-weight:600;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:24px}
.login-err{font-size:12px;color:var(--red);margin-top:10px;display:none}

/* 탑바 */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-logo{font-size:14px;font-weight:600;color:var(--text)}
.topbar-right{display:flex;gap:6px;align-items:center}
.user-badge{font-size:11px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:2px 9px}

.container{max-width:780px;margin:0 auto;padding:16px 16px 100px}

/* 카드 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.card-header h3{font-size:14px;font-weight:500;flex:1}
.card-body{padding:14px 16px}
.field-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;flex:1;min-width:110px}
.field label,.meta-label{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
input[type=text],textarea,select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text);outline:none;font-family:inherit}
input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.1)}
input::placeholder,textarea::placeholder{color:#c8c8c0;}
textarea{resize:none;min-height:52px;line-height:1.6;overflow:hidden}

/* 시트 바 */
.sheet-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet-bar-title{font-size:13px;font-weight:500;white-space:nowrap}
.sheet-status{font-size:12px;color:var(--text3);margin-left:4px}

/* 안내 박스 */
.info-box{background:var(--accent-bg);border:1px solid #bfdbfe;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;font-size:12px;color:#1e40af;line-height:1.6}
.info-box.orange{background:var(--orange-bg);border-color:#fed7aa;color:#9a3412}
.info-box.green{background:var(--green-bg);border-color:#bbf7d0;color:#14532d}
.info-box b{font-weight:600}

/* 섹션 버튼 */
.sec-btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;position:relative}
.sec-btn{font-size:14px;font-weight:600;padding:8px 16px;border:2px solid var(--border2);border-radius:12px;cursor:pointer;background:var(--surface);color:var(--text2);white-space:nowrap;transition:all .12s;position:relative}
.sec-btn:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.sec-btn.v{border-color:#93c5fd;color:var(--accent);background:var(--accent-bg)}
.sec-btn.ch{border-color:#86efac;color:var(--green);background:var(--green-bg)}
.sec-btn.br{border-color:#fdba74;color:var(--orange);background:var(--orange-bg)}
.sec-btn.pc{border-color:#c4b5fd;color:var(--purple);background:var(--purple-bg)}
.sec-btn.tag{border-color:#f9a8d4;color:var(--pink);background:var(--pink-bg)}
.sec-btn.other{border-color:var(--border2);color:var(--text2)}
.sec-btn.undo{font-size:12px;font-weight:400;color:var(--text3);border-style:dashed}
/* 송폼 태그 */
.sf-tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;min-height:52px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);margin-top:8px;overflow:visible;position:relative}
.sf-empty{color:var(--text3);font-style:italic;font-size:13px}
.sf-tag-item{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border-radius:12px;font-size:14px;font-weight:700;cursor:grab;user-select:none;transition:all .15s;min-width:48px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:visible}
.sf-tag-item.v{background:#dbeafe;color:#1e40af;border:2px solid #93c5fd}
.sf-tag-item.ch{background:#dcfce7;color:#166534;border:2px solid #86efac}
.sf-tag-item.br{background:var(--orange-bg);color:var(--orange);border:2px solid #fdba74}
.sf-tag-item.pc{background:#ede9fe;color:#5b21b6;border:2px solid #c4b5fd}
.sf-tag-item.tag{background:var(--pink-bg);color:var(--pink);border:2px solid #f9a8d4}
.sf-tag-item.other{background:#f1f5f9;color:#475569;border:2px solid #cbd5e1}
.sf-tag-item.dragging{opacity:.35;transform:scale(.95)}
.sf-tag-x{position:absolute;top:-7px;right:-7px;width:18px;height:18px;background:#ef4444;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:0;transition:opacity .15s}
.sf-tag-item:hover .sf-tag-x{opacity:1}
.sf-rep{font-size:14px;font-weight:700;margin-left:5px;opacity:.9}
.sf-ins-btn{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:transparent;color:var(--text3);font-size:11px;cursor:pointer;border:1px dashed var(--border2);transition:all .15s;flex-shrink:0}
.sf-ins-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 커스텀 섹션 */
.custom-row{display:flex;gap:6px;margin-top:5px}
.custom-row input{flex:1;font-size:12px;padding:5px 9px}
.custom-row button{font-size:12px;padding:5px 11px;border:1px solid var(--border2);border-radius:var(--radius-sm);cursor:pointer;background:var(--surface);color:var(--text2)}
.custom-row button:hover{background:var(--bg)}
/* 섹션 반복 팝업 */
.rep-popup{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px;display:flex;gap:4px;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.12);white-space:nowrap}
.rep-popup-btn{font-size:11px;padding:3px 9px;border:1px solid var(--border);border-radius:20px;cursor:pointer;color:var(--text3);background:var(--surface)}
.rep-popup-btn:hover,.rep-popup-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.dd{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.12);padding:10px;z-index:9999;min-width:160px}
.dd-row{display:flex;flex-wrap:wrap;gap:6px}
.dd-btn{font-size:13px;padding:5px 12px;border:1px solid var(--border2);border-radius:20px;cursor:pointer;background:var(--surface);color:var(--text2)}
.dd-btn:hover,.dd-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.dd-sep{height:1px;background:var(--border);margin:8px 0}
.dd-custom{display:flex;gap:6px;align-items:center}
.dd-custom input{flex:1;padding:5px 8px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px}
.dd-custom button{padding:5px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);cursor:pointer;background:var(--surface);font-size:13px}
.dd-label{font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:500}
.dd-btn-lg{font-size:14px;font-weight:600;padding:7px 16px;border:2px solid var(--border2);border-radius:10px;cursor:pointer;background:var(--surface);color:var(--text2);transition:all .1s;white-space:nowrap}
.dd-btn-lg:hover,.dd-btn-lg.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
/* 가사 입력 */
.lyrics-phase{margin-top:14px}
.meta-edit-btn{font-size:10px;padding:1px 6px;border:1px solid var(--border2);border-radius:20px;cursor:pointer;background:var(--surface);color:var(--text3);margin-left:4px;vertical-align:middle}
.meta-edit-btn:hover{border-color:var(--accent);color:var(--accent)}
.meta-edit-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.full-lyrics-view{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-top:8px}
.full-sec-block{border-bottom:1px solid var(--border)}
.full-sec-block:last-child{border-bottom:none}
.full-sec-header{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg)}
.full-sec-rep{font-size:11px;color:var(--text3);margin-left:auto}

.bulk-editor{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.bulk-sec-block{border-bottom:1px solid var(--border)}
.bulk-sec-block:last-child{border-bottom:none}
.bulk-sec-header{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--bg)}
.bulk-sec-label{font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px}
.bulk-sec-label.v{background:#dbeafe;color:#1e40af}
.bulk-sec-label.ch{background:#dcfce7;color:#166534}
.bulk-sec-label.br{background:var(--orange-bg);color:var(--orange)}
.bulk-sec-label.pc{background:#ede9fe;color:#5b21b6}
.bulk-sec-label.tag{background:var(--pink-bg);color:var(--pink)}
.bulk-sec-label.other{background:#f1f5f9;color:#475569}
.bulk-sec-ref{font-size:11px;color:var(--text3);margin-left:auto}
.bulk-sec-ta{width:100%;border:none;outline:none;resize:none;padding:10px 12px;font-size:13px;line-height:1.8;font-family:inherit;background:var(--surface);min-height:52px;display:block}
.bulk-sec-ta::placeholder{color:var(--text3)}
/* 곡 카드 */
.song-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
.song-card.active-song{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.1)}
.song-card-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg);border-bottom:1px solid var(--border);cursor:pointer;border-radius:11px 11px 0 0}
.song-card-head.active-head{background:#eff6ff}
.active-badge{font-size:10px;background:var(--accent);color:#fff;padding:2px 7px;border-radius:20px;margin-left:6px;font-weight:600}
.song-num{width:24px;height:24px;background:var(--text);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.song-num.offering{background:var(--purple)}
.song-title-area{flex:1;min-width:0}
.song-title-disp{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-key-disp{font-size:12px;color:var(--text3);margin-top:1px}
.song-card-acts{display:flex;gap:2px;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px 8px;color:var(--text3);border-radius:var(--radius-sm);font-size:18px;transition:all .15s}
.icon-btn:hover{background:var(--border)}
.song-card-body{padding:14px}
.song-meta-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.song-meta-f{display:flex;flex-direction:column;gap:3px}
.song-meta-f label{font-size:11px;color:var(--text3)}
/* 업로드 */
.upload-compact{margin:10px 0 0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.upload-compact-label{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.upload-compact-area{position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px dashed var(--border2);border-radius:var(--radius-sm);cursor:pointer;transition:border-color .15s;min-height:38px}
.upload-compact-area:hover,.upload-compact-area.drag{border-color:var(--accent);background:#f0f4ff}
.upload-compact-area:focus{outline:2px solid var(--accent);outline-offset:2px}
.upload-compact-ico{font-size:16px;flex-shrink:0}
.upload-compact-txt{font-size:12px;color:var(--text3)}
.upload-compact-prev{max-height:60px;max-width:120px;border-radius:4px;object-fit:contain;display:none;margin-left:auto}
.parse-result{border-radius:var(--radius-sm);padding:8px 12px;margin-top:8px;display:none;font-size:12px;font-weight:500}
.parse-ok{background:var(--green-bg);border:1px solid #bbf7d0;color:var(--green)}
.parse-err{background:var(--red-bg);border:1px solid #fca5a5;color:var(--red)}
.spinner-wrap{display:none;align-items:center;gap:8px;padding:10px 12px}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* 기타 */
.save-result{background:var(--green-bg);border:1px solid #bbf7d0;border-radius:var(--radius-sm);padding:12px 14px;margin-top:12px;display:none}
.save-result-title{font-size:13px;font-weight:600;color:var(--green);margin-bottom:8px}
.save-result-body{font-size:12px;color:#14532d;line-height:1.8}
.btn{padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;font-family:inherit;border:1px solid var(--border2);background:var(--surface);color:var(--text);transition:all .1s}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn-primary:hover{background:#333}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-green:hover{background:#15803d}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-block{width:100%}
.btn-dashed{border-style:dashed;color:var(--text3)}
.btn-dashed:hover{color:var(--text);border-color:var(--border2);background:var(--bg)}
.btn-offering{border-style:dashed;border-color:#c4b5fd;color:var(--purple)}
.btn-offering:hover{background:var(--purple-bg)}
.preview-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:12px;display:none}
.preview-box h3{font-size:14px;font-weight:500;margin-bottom:10px}
.preview-text{font-family:monospace;font-size:11px;white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:var(--radius-sm);max-height:280px;overflow-y:auto;line-height:1.7;border:1px solid var(--border)}
.offering-badge{font-size:11px;background:var(--purple-bg);color:var(--purple);border:1px solid #c4b5fd;padding:2px 8px;border-radius:20px;font-weight:500;margin-left:6px}
.notice{font-size:12px;color:var(--text2);background:var(--bg);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:10px;border:1px solid var(--border)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;z-index:9999;opacity:0;transform:translateY(10px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.divider{height:1px;background:var(--border);margin:14px 0}

.bulk-lyrics-wrap{margin-top:4px}
.bulk-editor{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.bulk-sec-block{border-bottom:1px solid var(--border)}
.bulk-sec-block:last-child{border-bottom:none}
.bulk-sec-header{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--bg);border-bottom:1px solid var(--border)}
.bulk-sec-label{font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px}
.bulk-sec-label.v{background:#dbeafe;color:#1e40af}
.bulk-sec-label.ch{background:#dcfce7;color:#166534}
.bulk-sec-label.br{background:var(--orange-bg);color:var(--orange)}
.bulk-sec-label.pc{background:#ede9fe;color:#5b21b6}
.bulk-sec-label.tag{background:var(--pink-bg);color:var(--pink)}
.bulk-sec-label.other{background:#f1f5f9;color:#475569}
.bulk-sec-ref{font-size:11px;color:var(--text3);margin-left:auto}
.bulk-sec-ta{width:100%;border:none;outline:none;resize:none;padding:10px 12px;font-size:13px;line-height:1.8;font-family:inherit;background:var(--surface);min-height:52px;display:block}
.bulk-sec-ta::placeholder{color:var(--text3);font-style:italic}

/* 활성 곡 */
.song-card.active-song{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.12)}
.song-card-head.active-head{background:#eff6ff}
.active-badge{font-size:10px;background:var(--accent);color:#fff;padding:2px 7px;border-radius:20px;margin-left:6px;font-weight:600}

</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🎵</div>
    <div class="login-title">예배 Set List 빌더</div>
    <div class="login-sub">R45 Worship 전용</div>
    <div id="g_id_onload"
      data-client_id="872282472534-h6mmifuvp99oa5c2naa5t32lle962mtg.apps.googleusercontent.com"
      data-callback="handleGoogleLogin"
      data-auto_prompt="true"
      data-auto_select="true">
    </div>
    <div class="g_id_signin"
      data-type="standard" data-size="large" data-theme="outline"
      data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left">
    </div>
    <div class="login-err" id="loginErr">접근 권한이 없는 계정입니다.</div>
  </div>
</div>

<!-- 앱 -->
<div id="appScreen">
  <div class="topbar">
    <span class="topbar-logo">🎵 예배 Set List 빌더 <span style="font-weight:400;color:var(--text3);font-size:12px;">R45 Worship</span></span>
    <div class="topbar-right">
      <span class="user-badge" id="userBadge"></span>
      <button class="btn btn-sm" onclick="showPreview()">미리보기</button>
      <button class="btn btn-sm btn-green" onclick="saveToSheet()" id="saveBtn" style="display:none"><span id="saveBtnTxt">💾 시트 저장</span></button>
      <button class="btn btn-sm" onclick="logout()" style="color:var(--text3);border-color:transparent">로그아웃</button>
    </div>
  </div>

  <div class="container">

    <!-- 시트 연동 -->
    <div class="sheet-bar">
      <span class="sheet-bar-title">📋 시트 연동</span>
      <select id="sheetTab" style="flex:1;min-width:150px">
        <option value="">시트 탭 선택...</option>
      </select>
      <button class="btn btn-sm btn-primary" onclick="loadSheetInfo()">불러오기</button>
      <span class="sheet-status" id="sheetStatus"></span>
    </div>

    <!-- 기본 정보 -->
    <div class="card">
      <div class="card-header" onclick="toggleCard(this)">
        <h3>기본 정보</h3>
        <span class="carr" style="color:var(--text3);font-size:12px">▾</span>
      </div>
      <div class="card-body">
        <div class="notice">미디어팀에서 시트를 만들어주면 위에서 탭을 선택해 자동으로 불러올 수 있어요.</div>
        <div class="field-row">
          <div class="field"><label>날짜</label><input type="text" id="date" placeholder="2026.06.07" /></div>
          <div class="field"><label>예배</label><input type="text" id="service" placeholder="주일 1부 예배" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>PPT 담당</label><input type="text" id="ppt" placeholder="박혜미" /></div>
          <div class="field"><label>예배팀</label><input type="text" id="team" placeholder="김진양" /></div>
        </div>
      </div>
    </div>

    <!-- 곡 목록 -->
    <div id="songList"></div>

    <button class="btn btn-block btn-dashed" style="margin-bottom:6px" onclick="addSong(false)">+ 곡 추가</button>
    <button class="btn btn-block btn-offering" style="margin-bottom:16px" onclick="addSong(true)">+ 헌금송 추가 (1부 전용)</button>

    <!-- 저장 결과 안내 -->
    <div class="save-result" id="saveResult">
      <div class="save-result-title">✅ 시트에 저장됐어요!</div>
      <div class="save-result-body">
        📝 송폼과 가사가 시트에 입력됐어요.<br>
        🖼️ <b>악보 이미지는 시트에서 직접 삽입해주세요.</b><br>
        &nbsp;&nbsp;&nbsp;&nbsp;삽입 → 이미지 → <b>셀 위에 삽입</b> 클릭
      </div>
    </div>

    <!-- 미리보기 -->
    <div class="preview-box" id="previewBox">
      <h3>📋 시트 미리보기</h3>
      <div class="preview-text" id="previewText" style="font-family:inherit;background:#fff;padding:8px"></div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" onclick="copyText()">복사하기</button>
        <button class="btn btn-sm" onclick="document.getElementById('previewBox').style.display='none'">닫기</button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ALLOWED = ['hi5gol@gmail.com'];
const USER_NAMES = {
  'hi5gol@gmail.com': '김진양',
};
const SECTIONS = [
  {id:'INTRO',label:'INTRO',cls:'other',type:'bar'},
  {id:'V',    label:'V',   cls:'v',    type:'num'},
  {id:'PC',   label:'PC',  cls:'pc',   type:'simple'},
  {id:'CH',   label:'CH',  cls:'ch',   type:'num'},
  {id:'BR',   label:'BR',  cls:'br',   type:'num'},
  {id:'TAG',  label:'TAG', cls:'tag',  type:'num'},
  {id:'INTER',label:'INTER',cls:'other',type:'bar'},
  {id:'INST', label:'INST',cls:'other',type:'bar'},
  {id:'OUTRO',label:'OUTRO',cls:'other',type:'bar'},
];
const REPEATS=['','x2','x3','x4','x5','x6'];
const BAR_PRESETS=[4,8,16,24,32];
const NUM_OPTS={V:['V','V1','V2','V3','V4'],CH:['CH','CH1','CH2'],BR:['BR','BR1','BR2'],TAG:['TAG','TAG1','TAG2']};

const SEC_NORM={
  'b':'BR','br':'BR','bridge':'BR',
  'v':'V','ver':'V','verse':'V',
  'v1':'V1','v2':'V2','v3':'V3','v4':'V4',
  'c':'CH','ch':'CH','cho':'CH','chorus':'CH',
  'ch1':'CH1','ch2':'CH2','ch3':'CH3',
  'pre':'PC','pre-cho':'PC','pre-chorus':'PC','prechorus':'PC','pc':'PC',
  'inter':'INTER','interlude':'INTER',
  'inst':'INST','instrumental':'INST',
  'intro':'INTRO','outro':'OUTRO','tag':'TAG','tag1':'TAG1','tag2':'TAG2',
};

function normSec(t){
  if(!t) return 'V';
  const m=t.match(/^(.+?)\((\d+[+\d]*)\)$/i);
  if(m){
    const base=SEC_NORM[m[1].toLowerCase().trim()]||m[1].toUpperCase();
    return base+'('+m[2]+')';
  }
  return SEC_NORM[t.toLowerCase().trim()]||t.toUpperCase();
}

let songs=[],songCounter=0;
let APPS_URL='';let ANTHROPIC_KEY='';(async()=>{try{const r=await fetch('/api/env');const d=await r.json();APPS_URL=d.APPS_SCRIPT_URL||'';ANTHROPIC_KEY=d.ANTHROPIC_API_KEY||'';}catch(e){console.warn('env fail',e);}})();

// ── 구글 로그인 ──
function handleGoogleLogin(resp){
  const p=JSON.parse(atob(resp.credential.split('.')[1]));
  if(!ALLOWED.includes(p.email)){
    document.getElementById('loginErr').style.display='block';
    return;
  }
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  const userName = USER_NAMES[p.email] || p.email;
  document.getElementById('userBadge').textContent=userName;
  setTimeout(()=>{ if(APPS_URL) {
    document.getElementById('saveBtn').style.display='';
    loadSheetTabs();
  }},500);
}
function logout(){google.accounts.id.disableAutoSelect();location.reload();}

// ── 시트 연동 ──
async function loadSheetTabs(){
  setSS('탭 목록 불러오는 중...');
  try{
    const r=await fetch('/api/proxy?action=getTabs');
    const d=await r.json();
    const tabs=(d.tabs||[]).reverse();
    const sel=document.getElementById('sheetTab');
    sel.innerHTML='<option value="">시트 탭 선택...</option>';
    tabs.forEach(t=>{
      const o=document.createElement('option');
      o.value=t;o.textContent=t;sel.appendChild(o);
    });
    setSS('✅ '+tabs.length+'개 탭');
  }catch{setSS('❌ 연결 실패');}
}

async function loadSheetInfo(){
  // 탭 목록이 없으면 먼저 불러오기
  const sel=document.getElementById('sheetTab');
  if(sel.options.length<=1) await loadSheetTabs();
  const tab=sel.value;
  if(!tab){showToast('⚠️ 시트 탭을 선택해주세요');return;}
  await loadSheetData();
}

async function loadSheetData(){
  const tab=document.getElementById('sheetTab').value;
  if(!tab||!APPS_URL) return;
  setSS('읽는 중...');
  try{
    const r=await fetch('/api/proxy?action=getInfo&tab='+encodeURIComponent(tab));
    const d=await r.json();
    if(d.date) sv('date',d.date);
    if(d.service) sv('service',d.service);
    if(d.leader) sv('leader',d.leader);
    if(d.ppt) sv('ppt',d.ppt);
    if(d.team) sv('team',d.team);
    if(d.songs?.length){
      songs=[];songCounter=0;
      d.songs.forEach(s=>addSong(s.isOffering||false,s));
    }
    setSS('✅ 불러오기 완료');
    showToast('✅ 시트 정보를 불러왔어요!');
  }catch{setSS('❌ 읽기 실패');}
}

async function saveToSheet(){
  const tab=document.getElementById('sheetTab').value;
  if(!tab){showToast('⚠️ 시트 탭을 먼저 선택해주세요');return;}
  
  document.getElementById('saveBtnTxt').innerHTML='⏳ 저장 중...';
  document.getElementById('saveBtn').disabled=true;
  setSS('저장 중...');
  try{
    const payload={tab,songs:songs.map(s=>({
      num:s.num,isOffering:s.isOffering,title:s.title,key:s.key,
      leader:s.leader,link:s.link,
      sections:s.sections.map(sec=>({type:sec.type,repeat:sec.repeat,lyrics:sec.lyrics}))
    }))};
    const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json();
    if(d.ok){
      setSS('✅ 저장 완료');
      document.getElementById('saveResult').style.display='block';
      document.getElementById('saveResult').scrollIntoView({behavior:'smooth'});
      showToast('✅ 시트에 저장됐어요!');
    } else { setSS('❌ 저장 실패'); showToast('❌ 저장 실패: '+(d.error||'알 수 없는 오류')); }
  }catch(e){setSS('❌ 오류');showToast('❌ 오류가 발생했어요');}
  finally{document.getElementById('saveBtnTxt').innerHTML='💾 시트 저장';document.getElementById('saveBtn').disabled=false;}
}

function setSS(msg){document.getElementById('sheetStatus').textContent=msg;}
function sv(id,val){const el=document.getElementById(id);if(el)el.value=val;}

// ── 드롭다운 ──
document.addEventListener('click',e=>{
  if(!e.target.closest('.dd')&&!e.target.closest('.sec-btn')&&!e.target.closest('.sec-tag'))
    document.querySelectorAll('.dd').forEach(d=>d.remove());
});

function showDD(e,songId,sec){
  e.stopPropagation();
  document.querySelectorAll('.dd,.rep-popup').forEach(d=>d.remove());
  if(sec.type==='simple'){addSecById(songId,sec.id);return;}
  const btn=e.currentTarget;
  const dd=buildDD(sec,val=>{addSecById(songId,val);document.querySelectorAll('.dd').forEach(d=>d.remove());});
  document.body.appendChild(dd);
  const br=btn.getBoundingClientRect();
  dd.style.cssText='position:fixed;z-index:999999;';
  // 위치 계산
  const ddW=220;
  let left=br.left;
  if(left+ddW>window.innerWidth-8) left=window.innerWidth-ddW-8;
  dd.style.top=(br.bottom+4)+'px';
  dd.style.left=Math.max(8,left)+'px';
  setTimeout(()=>dd.querySelector('input')?.focus(),10);
}

function showTagDD(e,songId,idx){
  e.stopPropagation();
  document.querySelectorAll('.dd').forEach(d=>d.remove());
  const s=songs.find(s=>s.id===songId);if(!s)return;
  const sec=s.sections[idx];
  const baseId=sec.type.replace(/[\d(].*$/,'');
  const def=SECTIONS.find(s=>s.id===baseId);
  if(!def||def.type==='simple')return;
  const dd=buildDD(def,val=>{
    s.sections[idx].type=val;renderSongs();
    document.querySelectorAll('.dd').forEach(d=>d.remove());
  },sec.type);
  const wrap=e.currentTarget.parentElement;
  wrap.style.position='relative';
  wrap.appendChild(dd);
  setTimeout(()=>dd.querySelector('input')?.focus(),40);
}

const _ddCbs={};
function buildDD(sec,onSel,cur){
  const dd=document.createElement('div');
  dd.className='dd';
  dd.style.cssText='min-width:200px;padding:10px;';
  const uid='dd'+Date.now();
  _ddCbs[uid]=onSel;
  if(sec.type==='num'){
    const opts=NUM_OPTS[sec.id]||[sec.id];
    dd.innerHTML=`<div class="dd-row" style="flex-wrap:wrap;gap:8px">${opts.map(o=>`<button class="dd-btn-lg${o===cur?' active':''}" onclick="_ddCbs['${uid}']('${o}')">${o}</button>`).join('')}</div>`;
  } else {
    dd.innerHTML=`<div class="dd-row" style="flex-wrap:wrap;gap:8px">${BAR_PRESETS.map(n=>`<button class="dd-btn-lg${sec.id+'('+n+')'===cur?' active':''}" onclick="_ddCbs['${uid}']('${sec.id}(${n})')">${n}마디</button>`).join('')}</div><div class="dd-sep" style="margin:8px 0"></div><div class="dd-custom"><input id="${uid}" type="number" min="1" placeholder="직접 입력" onkeydown="if(event.key==='Enter'){const v=document.getElementById('${uid}').value;if(v)_ddCbs['${uid}']('${sec.id}('+v+')')}" /><button onclick="const v=document.getElementById('${uid}').value;if(v)_ddCbs['${uid}']('${sec.id}('+v+')')">확인</button></div>`;
  }
  return dd;
}

// ── 곡 관리 ──
function addSong(isOffering,prefill){
  songCounter++;
  const id='s'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
  songs.push({
    id,num:songCounter,isOffering:!!isOffering,
    title:prefill?.title||'',key:prefill?.key||'',
    leader:prefill?.leader||'',link:prefill?.link||'',
    sections:(prefill?.sections||[]).map(s=>({type:normSec(s.type),repeat:s.repeat||'',lyrics:s.lyrics||''})),
    open:true
  });
  renderSongs();
  setTimeout(()=>document.getElementById('t_'+id)?.focus(),60);
}

function removeSong(id){
  if(!confirm('이 곡을 삭제할까요?'))return;
  songs=songs.filter(s=>s.id!==id);
  songs.forEach((s,i)=>s.num=i+1);
  songCounter=songs.length;
  renderSongs();
}

function toggleSong(id){const s=songs.find(s=>s.id===id);if(s){s.open=!s.open;renderSongs();}}

function setSongEditable(sid, editable){
  const s=songs.find(s=>s.id===sid);
  if(!s)return;
  s.titleEditable=editable;
  renderSongs();
  if(editable) setTimeout(()=>document.getElementById('t_'+sid)?.focus(),60);
}
function syncSong(id,f,v){const s=songs.find(s=>s.id===id);if(s)s[f]=v;}
function addSecById(sid,type){
  const s=songs.find(s=>s.id===sid);if(!s)return;
  saveBulkState(sid);
  s.sections.push({type,repeat:'',lyrics:''});
  renderSongs();
}
function addCustomSec(sid){
  const inp=document.getElementById('cust_'+sid);
  const v=inp?.value?.trim();
  if(!v)return;
  saveBulkState(sid);
  addSecById(sid,v);
  inp.value='';
}

function saveBulkState(sid){
  const s=songs.find(s=>s.id===sid);if(!s)return;
  const editor=document.getElementById('bulk_'+sid);
  if(!editor)return;
  editor.querySelectorAll('textarea[data-idx]').forEach(ta=>{
    const idx=parseInt(ta.dataset.idx);
    if(!isNaN(idx)&&s.sections[idx]) s.sections[idx].lyrics=ta.value;
  });
}
function removeSec(sid,idx){
  const s=songs.find(s=>s.id===sid);if(!s)return;
  saveBulkState(sid);
  s.sections.splice(idx,1);
  renderSongs();
}
function removeLastSec(sid){
  const s=songs.find(s=>s.id===sid);
  if(s&&s.sections.length){saveBulkState(sid);s.sections.pop();renderSongs();}
}
function setRep(sid,idx,rep){
  const s=songs.find(s=>s.id===sid);
  if(s){saveBulkState(sid);s.sections[idx].repeat=rep;renderSongs();}
}
function syncSec(sid,idx,f,v){const s=songs.find(s=>s.id===sid);if(s&&s.sections[idx])s.sections[idx][f]=v;}

function getSF(secs){
  if(!secs.length)return'';
  return secs.map(s=>s.type+(s.repeat?'('+s.repeat+')':'')).join(' – ');
}
function tagCls(type){
  const b=type.replace(/[\d(].*$/,'').toLowerCase();
  return {v:'v',ch:'ch',br:'br',pc:'pc',tag:'tag'}[b]||'other';
}

// ── 렌더 ──
function renderSongs(){
  document.getElementById('songList').innerHTML=songs.map(renderSong).join('');
}

function renderSong(song){
  const body=!song.open?'':`
    <div class="song-card-body">
      <div class="song-meta-row">
        <div class="song-meta-f" style="flex:2;min-width:150px">
          <label style="display:flex;align-items:center;gap:4px">곡명
            <button class="meta-edit-btn ${song.titleEditable?'active':''}"
              onclick="event.stopPropagation();setSongEditable('${song.id}',${song.titleEditable?'false':'true'})">
              ${song.titleEditable?'✓ 확정':'수정'}
            </button>
          </label>
          <input type="text" id="t_${song.id}" value="${esc(song.title)}" placeholder="곡 제목"
            ${song.titleEditable?'':'readonly style="background:var(--bg);color:var(--text2);cursor:default"'}
            oninput="syncSong('${song.id}','title',this.value);document.getElementById('ttl_${song.id}').textContent=this.value||'(제목 없음)'" /></div>
        <div class="song-meta-f" style="width:68px"><label>키</label>
          <input type="text" value="${esc(song.key)}" readonly style="background:var(--bg);color:var(--text2);cursor:default" /></div>
        <div class="song-meta-f" style="flex:1;min-width:90px"><label>인도자</label>
          <input type="text" value="${esc(song.leader)}" readonly style="background:var(--bg);color:var(--text2);cursor:default" /></div>
        <div class="song-meta-f" style="flex:2;min-width:120px"><label>링크</label>
          <input type="text" value="${esc(song.link)}" placeholder="https://..." oninput="syncSong('${song.id}','link',this.value)" /></div>
      </div>

      <div class="upload-compact">
        <div class="upload-compact-label">🎼 악보로 자동 파싱</div>
        <div class="upload-compact-area"
          ondragover="event.preventDefault();this.classList.add('drag')"
          ondragleave="this.classList.remove('drag')"
          ondrop="handleDrop(event,'${song.id}')"
          onpaste="handlePaste(event,'${song.id}')"
          onclick="setActiveSong('${song.id}')"
          tabindex="0">
          <input type="file" accept="image/*" onchange="handleFile(event,'${song.id}')" style="position:absolute;inset:0;opacity:0;cursor:pointer" />
          <span class="upload-compact-ico">📷</span>
          <span class="upload-compact-txt">클릭 / 드래그 / 붙여넣기(Ctrl+V) — 송폼+가사 자동 파싱</span>
          <img class="upload-compact-prev" id="prev_${song.id}" />
        </div>
        <div class="spinner-wrap" id="spin_${song.id}" style="display:none"><div class="spinner"></div><span style="font-size:12px;color:var(--text3)">분석 중...</span></div>
        <div class="parse-result" id="pres_${song.id}"></div>
        <div style="font-size:11px;color:var(--text3);margin-top:5px">* 악보 이미지는 파싱 후 시트에서 직접 삽입 (삽입 → 이미지 → 셀 위에 삽입)</div>
      </div>

      <div style="margin-top:16px">
        <div class="sf-label">송폼 추가 <span style="font-size:11px;color:var(--text3);font-weight:400">클릭으로 추가 · 드래그로 순서변경 · <b style='color:var(--accent)'>태그 클릭 → 반복 횟수 설정</b></span></div>
        <div class="sec-btn-row" style="margin-top:8px">
          ${SECTIONS.map(sec=>`<button class="sec-btn ${sec.cls}" onclick="showDD(event,'${song.id}',${JSON.stringify(sec).replace(/"/g,'&quot;')})">${sec.label}</button>`).join('')}
          <button class="sec-btn undo" onclick="removeLastSec('${song.id}')">↩</button>
        </div>
        <div class="custom-row">
          <input type="text" id="cust_${song.id}" placeholder="커스텀 (예: 후렴만, 첫줄만, 오셔서다스리소서)" onkeydown="if(event.key==='Enter')addCustomSec('${song.id}')" />
          <button onclick="addCustomSec('${song.id}')">추가</button>
        </div>
        <div class="sf-tags" id="sftags_${song.id}" ondragover="sfDragOver(event,'${song.id}')" ondrop="sfDrop(event,'${song.id}')" ondragleave="sfDragLeave(event,'${song.id}')">
          ${song.sections.length===0?'<span class="sf-empty">👆 위 버튼을 눌러 송폼을 만들어보세요</span>':song.sections.map((sec,idx)=>`
            <span class="sf-ins-btn" onclick="showInsertDD(event,'${song.id}',${idx})">+</span>
            <span class="sf-tag-item ${tagCls(sec.type)}"
              draggable="true"
              ondragstart="sfDragStart(event,'${song.id}',${idx})"
              ondragend="sfDragEnd(event)"
              onclick="event.stopPropagation();showRepPopup(event,'${song.id}',${idx})">
              ${sec.type}${sec.repeat?'<span class="sf-rep">×'+sec.repeat.replace('x','')+'</span>':''}
              <span class="sf-tag-x" onclick="event.stopPropagation();removeSec('${song.id}',${idx})">✕</span>
            </span>`).join('')}
          ${song.sections.length>0?`<span class="sf-ins-btn" onclick="showInsertDD(event,'${song.id}',${song.sections.length})">+</span>`:''}
        </div>
      </div>

      ${song.sections.length>0?`
      <div class="lyrics-phase">
        ${song.lyricsCompleted?`
        <div class="sf-label" style="margin-top:4px">전체 가사 <button class="btn btn-sm" style="margin-left:8px;font-size:11px" onclick="event.stopPropagation();songs.find(s=>s.id==='${song.id}').lyricsCompleted=false;renderSongs()">✎ 수정</button></div>
        <div class="full-lyrics-view">
          ${song.sections.map((sec,idx)=>{
            const cls=tagCls(sec.type);
            const repNum=sec.repeat?parseInt(sec.repeat.replace('x',''))||1:1;
            const blocks=[];
            for(let r=0;r<repNum;r++){
              blocks.push(`<div class="full-sec-block">
                <div class="full-sec-header">
                  <span class="bulk-sec-label ${cls}">${sec.type}</span>
                  ${repNum>1?'<span class="full-sec-rep">'+( r+1)+'/'+repNum+'</span>':''}
                </div>
                <textarea class="bulk-sec-ta" oninput="syncSecLyricsFull('${song.id}',${idx},this.value);autoResize(this)" onfocus="autoResize(this)">${esc(sec.lyrics)}</textarea>
              </div>`);
            }
            return blocks.join('');
          }).join('')}
        </div>
        `:`
        <div class="sf-label">가사 입력 <span style="font-size:11px;color:var(--text3);font-weight:400">중복 섹션은 한 번만 작성</span></div>
        <div class="bulk-editor" id="bulk_${song.id}" style="margin-top:8px">${buildBulkTemplate(song)}</div>
        <button class="btn btn-primary btn-block" style="margin-top:8px" onclick="applyBulkLyrics('${song.id}')">✓ 가사 완성</button>
        `}
      </div>`:''}
    </div>`;

  return `
    <div class="song-card" data-sid="${song.id}" onclick="setActiveSong('${song.id}')">
      <div class="song-card-head" onclick="toggleSong('${song.id}')">
        <div class="song-num${song.isOffering?' offering':''}">${song.isOffering?'♪':song.num}</div>
        <div class="song-title-area">
          <div class="song-title-disp" id="ttl_${song.id}">${esc(song.title)||'(제목 없음)'}${song.isOffering?'<span class="offering-badge">헌금송</span>':''}</div>
          <div class="song-key-disp">${song.key?'Key: '+song.key:''}</div>
        </div>
        <div class="song-card-acts" onclick="event.stopPropagation()">

// ── 가사 통합 입력 ──
// 가사 불필요 기본 섹션 (INTRO/INTER/INST/OUTRO) — 가사 있으면 포함
const NO_LYRICS_DEFAULT=new Set(['INTRO','INTER','INST','OUTRO']);

function buildBulkTemplate(song){
  // 중복 제거: 같은 타입 첫 번째만 (NO_LYRICS_DEFAULT는 가사 있을 때만)
  const seen=new Set();
  const unique=[];
  song.sections.forEach(sec=>{
    const baseType=sec.type.replace(/[\d(].*$/,'');
    if(NO_LYRICS_DEFAULT.has(baseType)&&!sec.lyrics) return;
    if(!seen.has(sec.type)){seen.add(sec.type);unique.push(sec);}
  });
  // 선택적 추가 가능한 NO_LYRICS 섹션
  const skipped=[];
  song.sections.forEach(sec=>{
    const baseType=sec.type.replace(/[\d(].*$/,'');
    if(NO_LYRICS_DEFAULT.has(baseType)&&!sec.lyrics&&!seen.has(sec.type)){
      seen.add(sec.type);skipped.push(sec.type);
    }
  });
  if(unique.length===0&&skipped.length===0)
    return '<div style="padding:12px;color:var(--text3);font-size:13px;text-align:center">가사 입력이 필요한 섹션이 없어요</div>';
  const blocks=unique.map(sec=>{
    const cls=tagCls(sec.type);
    // 이 타입이 몇 번 쓰이는지
    const cnt=song.sections.filter(s=>s.type===sec.type).length;
    const ref=cnt>1?`<span class="bulk-sec-ref">${cnt}곳 적용</span>`:'';
    return `<div class="bulk-sec-block">
      <div class="bulk-sec-header"><span class="bulk-sec-label ${cls}">${sec.type}</span>${ref}</div>
      <textarea class="bulk-sec-ta" data-type="${sec.type}" placeholder="${sec.type} 가사..." oninput="autoResize(this)" onfocus="autoResize(this)">${esc(sec.lyrics)}</textarea>
    </div>`;
  }).join('');
  const skipBtns=skipped.length?`<div style="padding:8px 12px;background:var(--bg);border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:6px;align-items:center">
    <span style="font-size:11px;color:var(--text3)">가사 추가 (선택):</span>
    ${skipped.map(t=>`<button class="btn btn-sm" onclick="addLyricsBlock(this,'${t}')" style="font-size:11px">${t} +</button>`).join('')}
  </div>`:'';
  return blocks+skipBtns;
}

function addLyricsBlock(btn, type){
  const editor=btn.closest('.bulk-editor');
  if(!editor)return;
  const cls=tagCls(type);
  const block=document.createElement('div');
  block.className='bulk-sec-block';
  block.innerHTML=`<div class="bulk-sec-header"><span class="bulk-sec-label ${cls}">${type}</span></div>
    <textarea class="bulk-sec-ta" data-type="${type}" placeholder="${type} 가사..." oninput="autoResize(this)" onfocus="autoResize(this)"></textarea>`;
  // skipBtns div 앞에 삽입
  const skipDiv=editor.querySelector('[style*="가사 추가"]');
  if(skipDiv) editor.insertBefore(block, skipDiv);
  else editor.appendChild(block);
  // 버튼 제거
  btn.remove();
  block.querySelector('textarea').focus();
}

function handleDrop(e,sid){e.preventDefault();e.currentTarget.classList.remove('drag');const f=e.dataTransfer.files[0];if(f?.type.startsWith('image/'))parseImg(f,sid);}
function handleFile(e,sid){const f=e.target.files[0];if(f)parseImg(f,sid);}

async function parseImg(file,sid){
  const prev=document.getElementById('prev_'+sid);
  const spin=document.getElementById('spin_'+sid);
  const pres=document.getElementById('pres_'+sid);
  const reader=new FileReader();
  reader.onload=async e=>{
    prev.src=e.target.result;prev.style.display='block';
    spin.style.display='block';pres.style.display='none';
    const b64=e.target.result.split(',')[1];
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-api-key':ANTHROPIC_KEY,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body:JSON.stringify({
          model:'claude-opus-4-5',max_tokens:2000,
          messages:[{role:'user',content:[
            {type:'image',source:{type:'base64',media_type:file.type,data:b64}},
            {type:'text',text:`이 악보에서 정보를 추출해서 JSON으로만 답해줘. 설명 없이 JSON만.

{
  "title": "곡명",
  "key": "키 (예: G, Eb, A)",
  "sections": [
    {
      "type": "섹션명",
      "repeat": "반복 (x2, x3 등. 없으면 빈 문자열)",
      "lyrics": "가사만 (코드번호/연주지시어 제외)"
    }
  ]
}

섹션명 규칙 (반드시 따를 것):
- B, Br, Bridge → BR
- V, Ver, Verse → V (번호있으면 V1, V2, V3)
- C, Ch, Cho, Chorus → CH (번호있으면 CH1, CH2)
- Pre, Pre-cho, Pre-chorus, PC → PC
- Inter, Interlude → INTER (마디수 있으면 INTER(8) 형식)
- Inst, Instrumental → INST (마디수 있으면 INST(8) 형식)
- Intro → INTRO (마디수 있으면 INTRO(8) 형식)
- Outro → OUTRO (마디수 있으면 OUTRO(4) 형식)
- Tag → TAG

주의사항:
- 손글씨 연주지시어(킥, 베이스in, Band in, 1st, 2nd 등) 가사에서 완전히 제외
- 코드 번호(1 4 6 5 등) 가사에서 완전히 제외
- 악보 상단에 송폼이 명시되어 있으면 그 순서대로 sections 배열 구성
- 가사는 반드시 구절마다 줄바꿈(\\n)으로 구분해서 입력. 한 줄에 한 구절씩.
- 예: "주님의 임재 안에 나 여기 서있네\\n고요한 이곳에서 잠잠히 서있네"
- 여러 절이 겹쳐있는 경우 V1, V2 등으로 분리`}
          ]}]
        })
      });
      const data=await res.json();
      spin.style.display='none';
      const txt=data.content?.[0]?.text||'';
      const m=txt.match(/\{[\s\S]*\}/);
      if(!m)throw new Error('파싱실패');
      const parsed=JSON.parse(m[0]);
      const s=songs.find(s=>s.id===sid);
      if(s){
        if(parsed.title&&!s.title)s.title=parsed.title;
        if(parsed.key&&!s.key)s.key=parsed.key;
        if(parsed.sections?.length){
          s.sections=parsed.sections.map(sec=>({
            type:normSec(sec.type),
            repeat:sec.repeat||'',
            lyrics:sec.lyrics||''
          }));
        }
        renderSongs();
      }
      pres.className='parse-result parse-ok';
      pres.textContent='✅ 파싱 완료 — 내용을 확인하고 필요하면 수정하세요';
      pres.style.display='block';
      showToast('✅ 악보 파싱 완료!');
    }catch(err){
      spin.style.display='none';
      pres.className='parse-result parse-err';
      pres.textContent='❌ 파싱 실패 — 수동으로 입력해주세요';
      pres.style.display='block';
    }
  };
  reader.readAsDataURL(file);
}

function generateSheet(){
  const date=gv('date'),service=gv('service'),leader=gv('leader'),ppt=gv('ppt'),team=gv('team');
  const reg=songs.filter(s=>!s.isOffering);
  const off=songs.filter(s=>s.isOffering);
  let lines=[];
  lines.push(`,${date},,${service}`);
  lines.push(`,담당자 *해당 텀 담당자,,"송리스트 *키,BPM 필수 아님",인도자,링크`);
  reg.forEach((song,i)=>{
    let pre=',,,',nf='';
    if(i===0){pre=',PPT';nf=ppt;}
    else if(i===1){pre=',예배팀';nf=team;}
    lines.push(`${pre},${nf},${song.title}${song.key?' ('+song.key+')':''},${i===0?leader:''},${song.link||''}`);
  });
  off.forEach(song=>{
    lines.push(`,,,헌금송 / ${song.title},${song.leader||'예배팀'},${song.link||''}`);
  });
  lines.push('');
  reg.forEach(song=>{
    const sf=getSF(song.sections);
    lines.push(`,${song.num},${song.title}`);
    lines.push(`,,${sf}`);
    lines.push(',송폼 가사,,,코멘트,악보');
    song.sections.forEach(sec=>{
      const tag=sec.type+(sec.repeat?'('+sec.repeat+')':'');
      lines.push(sec.lyrics?`,,${tag},"${sec.lyrics.replace(/"/g,'""')}"`:`,, ${tag}`);
    });
    lines.push('');
  });
  off.forEach(song=>{
    const sf=getSF(song.sections);
    lines.push(`,헌금송,헌금송 / ${song.title}`);
    lines.push(`,,${sf}`);
    lines.push(',송폼 가사,,,코멘트,악보');
    song.sections.forEach(sec=>{
      const tag=sec.type+(sec.repeat?'('+sec.repeat+')':'');
      lines.push(sec.lyrics?`,,${tag},"${sec.lyrics.replace(/"/g,'""')}"`:`,, ${tag}`);
    });
    lines.push('');
  });
  return lines.join('\n');
}

  html+=`</table>`;
  // 각 곡
  songs.forEach(song=>{

    html+=`<div style="border:1px solid #e0e0e0;border-radius:4px;margin-bottom:10px;overflow:hidden">`;

    html+=`<table style="width:100%;border-collapse:collapse">`;
    song.sections.forEach(sec=>{
      const repNum=sec.repeat?parseInt(sec.repeat.replace('x',''))||1:1;
      const label=sec.type+(sec.repeat?' '+sec.repeat:'');
      for(let r=0;r<repNum;r++){
        const repLabel=repNum>1?label+` (${r+1}/${repNum})`:label;
        const lyricLines=(sec.lyrics||'').split('\n').filter(l=>l.trim());
        if(lyricLines.length===0){
          html+=`<tr><td style="padding:3px 8px;border:1px solid #f0f0f0;width:80px;color:#888;font-size:11px">${repLabel}</td><td style="padding:3px 8px;border:1px solid #f0f0f0;color:#ccc;font-style:italic">—</td></tr>`;
        } else {
          html+=`<tr><td style="padding:3px 8px;border:1px solid #f0f0f0;width:80px;color:#555;font-size:11px;vertical-align:top" rowspan="${lyricLines.length}">${repLabel}</td><td style="padding:3px 8px;border:1px solid #f0f0f0">${lyricLines[0]}</td></tr>`;
          for(let li=1;li<lyricLines.length;li++){
            html+=`<tr><td style="padding:3px 8px;border:1px solid #f0f0f0">${lyricLines[li]}</td></tr>`;
          }
        }
      }
    });
    html+=`</table></div>`;
  });
  html+=`</div>`;
  return html;
}

let _dragSong=null,_dragIdx=null;
function sfDragStart(e,sid,idx){
  _dragSong=sid;_dragIdx=idx;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}
function sfDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.sf-tag-item').forEach(el=>el.classList.remove('drag-over'));
  _dragSong=null;_dragIdx=null;
}
function sfDragOver(e,sid){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
}
function sfDragLeave(e,sid){}
function sfDrop(e,sid){
  e.preventDefault();
  if(_dragSong!==sid||_dragIdx===null)return;
  const tags=document.getElementById('sftags_'+sid);
  const items=[...tags.querySelectorAll('.sf-tag-item')];
  // 드롭 위치 계산
  let dropIdx=null;
  for(let i=0;i<items.length;i++){
    const r=items[i].getBoundingClientRect();
    if(e.clientX<r.left+r.width/2){dropIdx=i;break;}
  }
  if(dropIdx===null)dropIdx=items.length;
  const s=songs.find(s=>s.id===sid);if(!s)return;
  const moved=s.sections.splice(_dragIdx,1)[0];
  if(dropIdx>_dragIdx)dropIdx--;
  s.sections.splice(dropIdx,0,moved);
  renderSongs();
}

}

function showInsertDD(e,sid,insertIdx){
  e.stopPropagation();
  document.querySelectorAll('.dd').forEach(d=>d.remove());
  const btn=e.currentTarget;
  const dd=document.createElement('div');
  dd.className='dd';
  const uid='dd'+Date.now();
  _ddCbs[uid]=(val)=>{
    const s=songs.find(s=>s.id===sid);if(!s)return;
    s.sections.splice(insertIdx,0,{type:val,repeat:'',lyrics:''});
    renderSongs();
    document.querySelectorAll('.dd').forEach(d=>d.remove());
  };
  // 섹션 버튼 그리드
  dd.innerHTML=`<div class="dd-label">삽입할 섹션 선택</div><div class="dd-row" style="flex-wrap:wrap;gap:4px">${
    SECTIONS.map(sec=>{
      if(sec.type==='num'){
        const opts=NUM_OPTS[sec.id]||[sec.id];
        return opts.map(o=>`<button class="dd-btn" onclick="_ddCbs['${uid}']('${o}')">${o}</button>`).join('');
      } else if(sec.type==='bar'){
        return BAR_PRESETS.map(n=>`<button class="dd-btn" onclick="_ddCbs['${uid}']('${sec.id}(${n})')">${sec.id}(${n})</button>`).join('');
      } else {
        return `<button class="dd-btn" onclick="_ddCbs['${uid}']('${sec.id}')">${sec.id}</button>`;
      }
    }).join('')
  }</div>`;
  btn.style.position='relative';
  btn.appendChild(dd);
}

</script>
</body>
